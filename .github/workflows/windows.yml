# Teste Sikax puis fabrique la distribution Windows sur une machine GitHub.
# L'archive « Sikax-windows » se télécharge depuis la page de l'exécution.
# Une étiquette de version (v1.0.0…) publie en plus l'archive dans une
# « Release » : un lien de téléchargement public, sans compte GitHub.
name: Distribution Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  fabriquer:
    runs-on: windows-latest
    permissions:
      contents: write  # pour publier la Release
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python outils/ci.py executer journal_tests.txt -- python -m pytest -p no:cacheprovider -rfE --tb=short

      # Le script est lancé comme le fait build_windows.bat sur le poste d'un
      # utilisateur : par Windows PowerShell, dans son propre environnement.
      - name: Fabrication et auto-contrôle (build_windows.ps1)
        if: always()
        run: python outils/ci.py executer journal_fabrication.txt -- powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build_windows.ps1 -SansTests -Python python

      - name: Détail en cas d'échec
        if: failure()
        run: python outils/ci.py signaler journal_tests.txt journal_fabrication.txt build\autotest.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sikax-windows
          path: dist/Sikax-*-windows.zip
          if-no-files-found: warn

      # Seulement si tout ce qui précède a réussi : on ne publie pas une version dont les tests échouent.
      - name: Publication de la version
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $archive = (Get-ChildItem dist\Sikax-*-windows.zip | Select-Object -First 1).FullName
          gh release create "$env:GITHUB_REF_NAME" "$archive" --title "Sikax $env:GITHUB_REF_NAME" --notes-file packaging\notes_version.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
