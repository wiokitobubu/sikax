[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sikax"
dynamic = ["version"]
description = "Modélisation, validation et simulation de mécanismes plans"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6-Essentials>=6.6",
    "numpy>=1.24",
    "pyqtgraph>=0.13.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pyinstaller>=6.6"]

[project.gui-scripts]
sikax = "sikax.application:lancer"

[tool.setuptools]
packages = { find = { include = ["sikax*"] } }

[tool.setuptools.dynamic]
version = { attr = "sikax.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:pyqtgraph.*"]
